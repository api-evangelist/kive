# Capabilities as documented by Kive. Kive does not publish individual tool
# names, so these are the documented capability statements, not invented
# tool identifiers.
capabilities:
- Browse Kive workspaces, saved products, trained models, studios, video presets,
  and previous generations
- Show generated images and videos inline when a Kive output is ready
- Create a saved product from a product page, public image URL, or uploaded product image
- Generate product images with Kive studios
- Generate product videos with Kive video presets (up to four presets and up to four
  sampled outputs per request)
- Edit existing images with Kive image editing
- Check generation status while Kive is working
behavior:
  video_defaults: one video by default, with audio on
  permissions: uses the caller's Kive workspace permissions and credits
  workspace_selection: client may prompt for a workspace when the user belongs to
    more than one
