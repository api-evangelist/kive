rules:
- Image generation cost is the per-image price multiplied by the number of versions
  requested (default is 4).
- Credits are only deducted for successful generations; failed generations and
  content-filtered outputs are automatically refunded.
- Unused credits roll over, capped at 2x the plan amount at renewal.
- One-time credit purchases are capped each billing month at the plan's monthly
  credit limit.
- Downgrading forfeits credits above the new plan's rollover limit.
- Free credits require a verified Google or Google Workspace account.
