apis:
- aid: kive:mcp
  name: Kive MCP Server
  description: 'The Kive MCP server is Kive''s programmable interface: an OAuth 2.1
    protected Model Context Protocol endpoint that lets an authorized agent browse Kive
    workspaces, saved products, trained models, studios and video presets, create saved
    products from a product page or image URL, generate product images and videos, edit
    existing images and poll generation status. Actions run under the authorizing user''s
    workspace permissions and spend that workspace''s credits.'
