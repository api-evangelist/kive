aid: kive
name: Kive
description: 'Kive is an AI product photography and campaign content platform for e-commerce
  brands, built by TO LABS AB and used by more than 10,000 brands. It generates accurate
  product shots, lifestyle scenes, campaign imagery and product videos from a brand''s
  own assets, using a large catalogue of professionally curated visual presets ("studios")
  tuned to categories such as fashion, cosmetics, skincare, jewellery and footwear. The
  platform pairs generation with a creative asset library, AI-powered search, boards,
  custom-trained subject models, bulk catalogue generation and editing tools (background
  removal and replacement, canvas extension, upscaling). Kive publishes no public REST
  API; its programmable surface is an OAuth-protected Model Context Protocol server at
  mcp.kive.ai that lets agents browse workspaces and products and create images and
  videos on the user''s credits.'
